<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NSIconMaker - Upload Icon</title>
  <style>
    body { font-family: sans-serif; background: #181818; color: #eee; padding: 20px; max-width: 500px; margin: 0 auto; }
    h1 { color: #4c97ff; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 14px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px; background: #242424; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; }
    .btn { background: #4c97ff; color: #fff; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn:hover { background: #3370cc; }
    #status { margin-top: 12px; font-size: 14px; color: #aaa; word-break: break-all; }
  </style>
</head>
<body>

  <h1>Upload Icon Layer</h1>

  <div class="field">
    <label>GitHub Personal Access Token (Fine-grained token with Contents: Read/Write):</label>
    <input type="text" id="token" placeholder="ghp_...">
  </div>

  <div class="field">
    <label>Select PNG File:</label>
    <input type="file" id="fileInput" accept="image/png">
  </div>

  <div class="field">
    <label>Icon Name (e.g., Icon_01.png):</label>
    <input type="text" id="fileName" placeholder="my_icon.png">
  </div>

  <button class="btn" onclick="uploadIcon()">Upload to GitHub Vault</button>

  <p id="status"></p>

  <script>
    const REPO = 'Aaron201194/NSIconMaker';
    const BRANCH = 'main';

    async function uploadIcon() {
      const token = document.getElementById('token').value.trim();
      const fileInput = document.getElementById('fileInput');
      let fileName = document.getElementById('fileName').value.trim();
      const status = document.getElementById('status');

      if (!token || fileInput.files.length === 0) {
        status.innerText = 'Please enter your token and select a PNG file.';
        return;
      }

      const file = fileInput.files[0];
      if (!fileName) fileName = file.name;
      if (!fileName.endsWith('.png')) fileName += '.png';

      status.innerText = 'Converting image...';
      const base64Data = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });

      status.innerText = 'Uploading to GitHub...';

      const apiUrl = `https://api.github.com/repos/${REPO}/contents/uploads/${encodeURIComponent(fileName)}`;

      try {
        const response = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Upload icon ${fileName}`,
            content: base64Data,
            branch: BRANCH
          })
        });

        if (response.ok) {
          status.innerText = `Successfully uploaded ${fileName}! Check your Vault page now.`;
        } else {
          const err = await response.json();
          status.innerText = `Upload failed: ${err.message}`;
        }
      } catch (err) {
        status.innerText = `Network error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
