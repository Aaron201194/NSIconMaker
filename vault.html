<script>
    const REPO = 'Aaron201194/NSIconMaker';
    const BRANCH = 'main';
    let allPacks = []; 
    let selectedPack = null;

    async function loadData() {
      const statusEl = document.getElementById('status');
      const treeUrl = `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`;
      
      try {
        const res = await fetch(treeUrl);
        if (!res.ok) throw new Error("Could not fetch repository tree");
        const data = await res.json();
        
        const uploadFiles = data.tree.filter(f => f.path.startsWith('uploads/') && f.type === 'blob');
        const packsMap = {};

        uploadFiles.forEach(file => {
          const pathSegments = file.path.split('/');
          if (pathSegments.length === 3) {
            const packName = pathSegments[1];
            const fileName = pathSegments[2];
            
            if (!packsMap[packName]) {
              packsMap[packName] = { name: packName, parts: {}, author: 'Unknown', date: 'N/A', desc: 'No description.', rawXmlUrl: null };
            }

            const rawUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${file.path}`;
            const upperName = fileName.toUpperCase();

            if (fileName.endsWith('.png')) {
              if (upperName.includes('PACK_ICO_PREVIEW')) {
                packsMap[packName].parts.PREVIEW = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_BG')) {
                packsMap[packName].parts.BG = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_ICO')) {
                packsMap[packName].parts.ICO = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_L1')) {
                packsMap[packName].parts.L1 = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_L2')) {
                packsMap[packName].parts.L2 = { url: rawUrl, name: fileName };
              }
            } else if (fileName === 'author.xml') {
              packsMap[packName].rawXmlUrl = rawUrl;
            }
          }
        });

        allPacks = Object.values(packsMap);
        
        await Promise.all(allPacks.map(async (pack) => {
          if (pack.rawXmlUrl) {
            try {
              const xmlRes = await fetch(pack.rawXmlUrl);
              const xmlText = await xmlRes.text();
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");
              
              pack.author = xmlDoc.getElementsByTagName("author")[0]?.textContent || 'Unknown';
              pack.date = xmlDoc.getElementsByTagName("dateCreated")[0]?.textContent || 'N/A';
              pack.desc = xmlDoc.getElementsByTagName("description")[0]?.textContent || 'No description.';
            } catch (e) { console.error(`Failed parsing XML for ${pack.name}`); }
          }
          pack.previewUrl = (pack.parts.PREVIEW?.url) || (pack.parts.ICO?.url) || (pack.parts.BG?.url) || (pack.parts.L1?.url) || (pack.parts.L2?.url) || '';
        }));

        if (statusEl) statusEl.style.display = 'none';
        renderFeatured();
        renderGrid();

      } catch (err) {
        if (statusEl) statusEl.innerText = `Error: ${err.message}`;
      }
    }

    function renderFeatured() {
      if (allPacks.length === 0) return;
      
      const todayStr = new Date().toISOString().split('T')[0];
      let seed = 0;
      for (let i = 0; i < todayStr.length; i++) {
        seed = (seed * 31 + todayStr.charCodeAt(i)) % 1000000000;
      }

      const shuffled = [...allPacks];
      for (let i = shuffled.length - 1; i > 0; i--) {
        seed = (seed * 9301 + 49297) % 233280;
        const j = Math.floor((seed / 233280) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      const featuredPacks = shuffled.slice(0, 3);
      const featuredGrid = document.getElementById('featuredGrid');
      if (!featuredGrid) return;
      
      featuredGrid.innerHTML = '';
      
      featuredPacks.forEach(pack => {
        const originalIndex = allPacks.indexOf(pack);
        
        const card = document.createElement('div');
        card.className = 'card';
        card.style.minWidth = '110px';
        card.onclick = () => openSidebar(originalIndex);
        card.innerHTML = `
          <img src="${pack.previewUrl}" alt="${pack.name}">
          <div class="card-title">${pack.name}</div>
        `;
        featuredGrid.appendChild(card);
      });

      const featuredSec = document.getElementById('featuredSection');
      if (featuredSec) featuredSec.style.display = 'block';
    }

    function renderGrid() {
      const searchInput = document.getElementById('searchInput');
      const authorFilter = document.getElementById('authorFilter');
      const reqBG = document.getElementById('reqBG');
      const reqICO = document.getElementById('reqICO');
      const reqL1 = document.getElementById('reqL1');
      const reqL2 = document.getElementById('reqL2');

      const searchStr = searchInput ? searchInput.value.toLowerCase() : '';
      const authorStr = authorFilter ? authorFilter.value.toLowerCase() : '';
      
      const checkBG = reqBG ? reqBG.checked : false;
      const checkICO = reqICO ? reqICO.checked : false;
      const checkL1 = reqL1 ? reqL1.checked : false;
      const checkL2 = reqL2 ? reqL2.checked : false;

      const grid = document.getElementById('packGrid');
      if (!grid) return;
      grid.innerHTML = '';

      allPacks.forEach((pack, index) => {
        if (searchStr && !pack.name.toLowerCase().includes(searchStr) && !pack.desc.toLowerCase().includes(searchStr)) return;
        if (authorStr && !pack.author.toLowerCase().includes(authorStr)) return;

        if (checkBG && !pack.parts.BG) return;
        if (checkICO && !pack.parts.ICO) return;
        if (checkL1 && !pack.parts.L1) return;
        if (checkL2 && !pack.parts.L2) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openSidebar(index);
        card.innerHTML = `
          <img src="${pack.previewUrl}" alt="${pack.name}">
          <div class="card-title">${pack.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openSidebar(index) {
      selectedPack = allPacks[index];
      const sb = document.getElementById('sidebar');
      
      const sbAuthor = document.getElementById('sbAuthor');
      const sbName = document.getElementById('sbName');
      const sbDate = document.getElementById('sbDate');
      const sbDesc = document.getElementById('sbDesc');

      if (sbAuthor) sbAuthor.innerText = selectedPack.author;
      if (sbName) sbName.innerText = selectedPack.name;
      if (sbDate) sbDate.innerText = `Created: ${selectedPack.date}`;
      if (sbDesc) sbDesc.innerText = selectedPack.desc;
      
      const imgContainer = document.getElementById('sbImages');
      if (imgContainer) {
        imgContainer.innerHTML = '';
        Object.values(selectedPack.parts).forEach(part => {
          const row = document.createElement('div');
          row.className = 'img-row';
          row.innerHTML = `
            <img src="${part.url}" alt="pack piece">
            <a href="${part.url}" download="${part.name}" target="_blank" class="btn" style="text-decoration:none; text-align:center;">Download</a>
          `;
          imgContainer.appendChild(row);
        });
      }

      const dlAllBtn = document.getElementById('sbDownloadAll');
      if (dlAllBtn) {
        dlAllBtn.onclick = () => {
          Object.values(selectedPack.parts).forEach(part => {
            const a = document.createElement('a');
            a.href = part.url;
            a.download = part.name;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
        };
      }

      if (sb) sb.classList.add('open');
    }

    function closeSidebar() {
      const sb = document.getElementById('sidebar');
      if (sb) sb.classList.remove('open');
    }

    loadData();
  </script>
