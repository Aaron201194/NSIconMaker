  <style>
    :root { --bg: #181818; --panel: #242424; --border: #333; --accent: #4c97ff; --text: #eee; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 2px solid var(--border); background: var(--panel); flex-shrink: 0; }
    h1 { margin: 0; font-size: 22px; color: var(--accent); }
    .nav-btn { background: #2a2a2a; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; transition: 0.2s; border: 1px solid var(--border); }
    .nav-btn:hover { background: #3a3a3a; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
    .btn:hover { background: #3370cc; }
    
    .main-container { display: flex; flex-grow: 1; overflow: hidden; }
    .gallery-area { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
    
    /* Featured Section */
    .featured-section { margin-bottom: 25px; background: linear-gradient(135deg, #222938, #242424); border: 1px solid #3a4b6b; border-radius: 8px; padding: 15px; }
    .featured-title { font-size: 15px; font-weight: bold; color: #ffab2e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .featured-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; }
    
    /* Filters */
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border); align-items: center; }
    .filters input[type="text"] { padding: 8px; background: #111; border: 1px solid var(--border); color: #fff; border-radius: 4px; flex-grow: 1; min-width: 150px; }
    .filters label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; background: #1a1a1a; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); }
    .filters label:hover { background: #2a2a2a; }
    
    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: transform 0.1s, border-color 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card img { width: 100px; height: 100px; object-fit: contain; image-rendering: pixelated; background: #111; border-radius: 4px; }
    .card-title { font-size: 13px; font-weight: bold; margin-top: 8px; color: #ccc; word-break: break-word; }
    
    /* Sidebar */
    .sidebar { width: 320px; background: var(--panel); border-left: 2px solid var(--border); padding: 20px; overflow-y: auto; flex-shrink: 0; display: none; flex-direction: column; box-sizing: border-box; }
    .sidebar.open { display: flex; }
    .close-btn { background: transparent; color: #aaa; border: none; cursor: pointer; text-align: right; font-size: 16px; margin-bottom: 10px; }
    .close-btn:hover { color: #fff; }
    
    .sb-author { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
    .sb-name { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 15px; word-break: break-word; }
    
    .sb-images { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .img-row { display: flex; gap: 15px; align-items: center; background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .img-row img { width: 64px; height: 64px; object-fit: contain; image-rendering: pixelated; background: #000; border-radius: 4px; }
    .img-row .btn { font-size: 11px; padding: 6px; }
    
    .sb-date { font-size: 12px; color: #888; margin-bottom: 8px; }
    .sb-desc { font-size: 14px; color: #ccc; line-height: 1.4; margin-bottom: 20px; flex-grow: 1; }
    
    #status { color: #aaa; font-size: 14px; margin-bottom: 10px; }
  </style>
  <script src="vault.js"></script>
</head>

  <div class="main-container">
    <div class="gallery-area">
      
      <!-- Featured Daily Packs Section -->
      <div class="featured-section" id="featuredSection" style="display: none;">
        <div class="featured-title">⭐ Featured Packs of the Day!</div>
        <div class="featured-grid" id="featuredGrid"></div>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search packs or descriptions..." oninput="renderGrid()">
        <input type="text" id="authorFilter" placeholder="Filter by author..." oninput="renderGrid()">
        <label><input type="checkbox" id="reqBG" onchange="renderGrid()"> Has BG</label>
        <label><input type="checkbox" id="reqICO" onchange="renderGrid()"> Has ICO</label>
        <label><input type="checkbox" id="reqL1" onchange="renderGrid()"> Has L1</label>
        <label><input type="checkbox" id="reqL2" onchange="renderGrid()"> Has L2</label>
      </div>

      <div id="status">Loading packs from GitHub repository...</div>
      <div class="grid" id="packGrid"></div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <button class="close-btn" onclick="closeSidebar()">✖ Close</button>
      <div class="sb-author" id="sbAuthor"></div>
      <div class="sb-name" id="sbName"></div>
      <div class="sb-images" id="sbImages"></div>
      <div class="sb-date" id="sbDate"></div>
      <div class="sb-desc" id="sbDesc"></div>
      <button class="btn" id="sbDownloadAll">Download All Parts</button>
      <button class="btn" id="yeah-btn" onclick="react('yeah')" style="background: #238636; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <img src="Emote/Yeah.png" style="width: 18px; height: 18px; object-fit: contain; image-rendering: pixelated; background: none;" alt="Yeah"> Yeah! <span id="yeah-count">0</span>
      </button>
      <button class="btn" id="boo-btn" onclick="react('boo')" style="background: #da3633; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <img src="Emote/Boo.png" style="width: 18px; height: 18px; object-fit: contain; image-rendering: pixelated; background: none;" alt="Boo"> Boo! <span id="boo-count">0</span>
      </button>

  <div class="sb-reactions" style="display: flex; gap: 10px; margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border);">
</div>

  <script>
    const REPO = 'Aaron201194/NSIconMaker';
    const BRANCH = 'main';
    let allPacks = []; 
    let selectedPack = null;

    async function loadData() {
      const statusEl = document.getElementById('status');
      const treeUrl = `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`;
      
      try {
        const res = await fetch(treeUrl);
        if (!res.ok) throw new Error("Could not fetch repository tree");
        const data = await res.json();
        
        const uploadFiles = data.tree.filter(f => f.path.startsWith('uploads/') && f.type === 'blob');
        const packsMap = {};

        uploadFiles.forEach(file => {
          const pathSegments = file.path.split('/');
          if (pathSegments.length === 3) {
            const packName = pathSegments[1];
            const fileName = pathSegments[2];
            
            if (!packsMap[packName]) {
              packsMap[packName] = { name: packName, parts: {}, author: 'Unknown', date: 'N/A', desc: 'No description.', rawXmlUrl: null };
            }

            const rawUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${file.path}`;
            const upperName = fileName.toUpperCase();

            if (fileName.endsWith('.png')) {
              if (upperName.includes('PACK_ICO_PREVIEW')) {
                packsMap[packName].parts.PREVIEW = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_BG')) {
                packsMap[packName].parts.BG = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_ICO')) {
                packsMap[packName].parts.ICO = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_L1')) {
                packsMap[packName].parts.L1 = { url: rawUrl, name: fileName };
              } else if (upperName.includes('_L2')) {
                packsMap[packName].parts.L2 = { url: rawUrl, name: fileName };
              }
            } else if (fileName === 'author.xml') {
              packsMap[packName].rawXmlUrl = rawUrl;
            }
          }
        });

        allPacks = Object.values(packsMap);
        
        await Promise.all(allPacks.map(async (pack) => {
          if (pack.rawXmlUrl) {
            try {
              const xmlRes = await fetch(pack.rawXmlUrl);
              const xmlText = await xmlRes.text();
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");
              
              pack.author = xmlDoc.getElementsByTagName("author")[0]?.textContent || 'Unknown';
              pack.date = xmlDoc.getElementsByTagName("dateCreated")[0]?.textContent || 'N/A';
              pack.desc = xmlDoc.getElementsByTagName("description")[0]?.textContent || 'No description.';
            } catch (e) { console.error(`Failed parsing XML for ${pack.name}`); }
          }
          pack.previewUrl = (pack.parts.PREVIEW?.url) || (pack.parts.ICO?.url) || (pack.parts.BG?.url) || (pack.parts.L1?.url) || (pack.parts.L2?.url) || '';
        }));

        if (statusEl) statusEl.style.display = 'none';
        renderFeatured();
        renderGrid();

      } catch (err) {
        if (statusEl) statusEl.innerText = `Error: ${err.message}`;
      }
    }

    function renderFeatured() {
      if (allPacks.length === 0) return;
      
      const todayStr = new Date().toISOString().split('T')[0];
      let seed = 0;
      for (let i = 0; i < todayStr.length; i++) {
        seed = (seed * 31 + todayStr.charCodeAt(i)) % 1000000000;
      }

      const shuffled = [...allPacks];
      for (let i = shuffled.length - 1; i > 0; i--) {
        seed = (seed * 9301 + 49297) % 233280;
        const j = Math.floor((seed / 233280) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      const featuredPacks = shuffled.slice(0, 3);
      const featuredGrid = document.getElementById('featuredGrid');
      if (!featuredGrid) return;
      
      featuredGrid.innerHTML = '';
      
      featuredPacks.forEach(pack => {
        const originalIndex = allPacks.indexOf(pack);
        
        const card = document.createElement('div');
        card.className = 'card';
        card.style.minWidth = '110px';
        card.onclick = () => openSidebar(originalIndex);
        card.innerHTML = `
          <img src="${pack.previewUrl}" alt="${pack.name}">
          <div class="card-title">${pack.name}</div>
        `;
        featuredGrid.appendChild(card);
      });

      const featuredSec = document.getElementById('featuredSection');
      if (featuredSec) featuredSec.style.display = 'block';
    }

    function renderGrid() {
      const searchInput = document.getElementById('searchInput');
      const authorFilter = document.getElementById('authorFilter');
      const reqBG = document.getElementById('reqBG');
      const reqICO = document.getElementById('reqICO');
      const reqL1 = document.getElementById('reqL1');
      const reqL2 = document.getElementById('reqL2');

      const searchStr = searchInput ? searchInput.value.toLowerCase() : '';
      const authorStr = authorFilter ? authorFilter.value.toLowerCase() : '';
      
      const checkBG = reqBG ? reqBG.checked : false;
      const checkICO = reqICO ? reqICO.checked : false;
      const checkL1 = reqL1 ? reqL1.checked : false;
      const checkL2 = reqL2 ? reqL2.checked : false;

      const grid = document.getElementById('packGrid');
      if (!grid) return;
      grid.innerHTML = '';

      allPacks.forEach((pack, index) => {
        if (searchStr && !pack.name.toLowerCase().includes(searchStr) && !pack.desc.toLowerCase().includes(searchStr)) return;
        if (authorStr && !pack.author.toLowerCase().includes(authorStr)) return;

        if (checkBG && !pack.parts.BG) return;
        if (checkICO && !pack.parts.ICO) return;
        if (checkL1 && !pack.parts.L1) return;
        if (checkL2 && !pack.parts.L2) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openSidebar(index);
        card.innerHTML = `
          <img src="${pack.previewUrl}" alt="${pack.name}">
          <div class="card-title">${pack.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openSidebar(index) {
      selectedPack = allPacks[index];
      const sb = document.getElementById('sidebar');
      
      const sbAuthor = document.getElementById('sbAuthor');
      const sbName = document.getElementById('sbName');
      const sbDate = document.getElementById('sbDate');
      const sbDesc = document.getElementById('sbDesc');

      if (sbAuthor) sbAuthor.innerText = selectedPack.author;
      if (sbName) sbName.innerText = selectedPack.name;
      if (sbDate) sbDate.innerText = `Created: ${selectedPack.date}`;
      if (sbDesc) sbDesc.innerText = selectedPack.desc;
      currentItemKey = 'pack_' + encodeURIComponent(selectedPack.name);
  let stats = JSON.parse(localStorage.getItem(currentItemKey) || '{"yeah": 0, "boo": 0}');
  updateReactionUI(stats);
      
      const imgContainer = document.getElementById('sbImages');
      if (imgContainer) {
        imgContainer.innerHTML = '';
        Object.values(selectedPack.parts).forEach(part => {
          const row = document.createElement('div');
          row.className = 'img-row';
          row.innerHTML = `
            <img src="${part.url}" alt="pack piece">
            <a href="${part.url}" download="${part.name}" target="_blank" class="btn" style="text-decoration:none; text-align:center;">Download</a>
          `;
          imgContainer.appendChild(row);
        });
      }

      const dlAllBtn = document.getElementById('sbDownloadAll');
      if (dlAllBtn) {
        dlAllBtn.onclick = () => {
          Object.values(selectedPack.parts).forEach(part => {
            const a = document.createElement('a');
            a.href = part.url;
            a.download = part.name;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
        };
      }

      if (sb) sb.classList.add('open');
    }

    function closeSidebar() {
      const sb = document.getElementById('sidebar');
      if (sb) sb.classList.remove('open');
    }

    loadData();
  </script>
</body>
</html>
